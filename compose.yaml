# =============================================================================
#  Try FX Replay Free: the stack. On its own, this file is the LOCAL run:
#
#    docker compose up -d --build        # http://localhost:4321
#
#  Production adds compose.prod.yaml, which removes the port and joins the
#  shared Caddy's external `edge` network:
#
#    docker compose -f compose.yaml -f compose.prod.yaml up -d --build
#
#  The port is bound to 127.0.0.1 only, so if the prod file is forgotten on the
#  server, nothing becomes public: the site is simply unreachable through Caddy.
#
#  EXACTLY ONE REPLICA. SQLite allows a single writer, and the database file
#  lives on one volume. Do not scale this service or add `deploy.replicas`.
# =============================================================================

name: fxr-challenge

services:
  fxr-web:
    image: fxr-challenge-web
    build:
      context: .
      target: runtime
    container_name: fxr-challenge-web
    restart: unless-stopped
    init: true # forwards SIGTERM to node, so `down` stops it cleanly
    mem_limit: 256m
    environment:
      DATABASE_PATH: /app/data/app.db # read by src/lib/server/db.ts
      # Optional. Unset or empty: GET /api/users answers 401 (listing disabled).
      # Set it in the git-ignored .env beside this file, never in the image.
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
    ports:
      - '127.0.0.1:4321:4321'
    volumes:
      - data:/app/data
    healthcheck:
      # The slim image has no curl, so node's fetch does the probe.
      # Target is GET / for now. A DB-aware /api/health would be better (see DECISIONS).
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4321/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  data:
